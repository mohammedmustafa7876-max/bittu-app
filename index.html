<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bittu — Tera AI Dost</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg-deep:#14151f;
    --bg-panel:#1c1e2b;
    --bg-bubble-mine:#2a2d3f;
    --marigold:#f4a53a;
    --teal:#4fd1c5;
    --text-primary:#f5f0e6;
    --text-muted:#9497ab;
    --danger-soft:#e8836b;
    --app-height:100vh;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:radial-gradient(circle at 50% -10%, #23263a 0%, var(--bg-deep) 60%);
    font-family:'Inter',sans-serif;
    color:var(--text-primary);
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:420px;
    height:var(--app-height);
    display:flex;
    flex-direction:column;
    background:var(--bg-deep);
    position:relative;
    overflow:hidden;
  }

  /* ---- Character stage ---- */
  .stage{
    position:relative;
    height:220px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 40%, #1a2b52 0%, #14151f 75%);
    border-bottom:1px solid rgba(255,255,255,0.06);
    overflow:hidden;
  }
  .energy-ring{
    position:absolute;
    top:50%; left:50%;
    margin-top:-70px; margin-left:-70px;
    border-radius:50%;
    border:2px solid #4d8cff;
    opacity:0;
  }
  .energy-ring.e1{ width:140px; height:140px; animation:energy 3s ease-out infinite; }
  .energy-ring.e2{ width:140px; height:140px; animation:energy 3s ease-out infinite 1s; }
  .energy-ring.e3{ width:140px; height:140px; animation:energy 3s ease-out infinite 2s; }
  @keyframes energy{
    0%{ transform:scale(0.6); opacity:0.6; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  .energy-spark{
    position:absolute;
    width:4px; height:4px;
    border-radius:50%;
    background:#7ab8ff;
    box-shadow:0 0 8px 2px #4d8cff;
    animation:sparkFloat 4s ease-in-out infinite;
  }
  @keyframes sparkFloat{
    0%,100%{ transform:translateY(0) translateX(0); opacity:0.3; }
    50%{ transform:translateY(-18px) translateX(6px); opacity:1; }
  }
  .stage-glow{
    position:absolute;
    width:190px;height:190px;
    border-radius:50%;
    background:#4d8cff;
    filter:blur(55px);
    opacity:0.35;
  }
  .listening-ring{
    position:absolute;
    width:130px;height:130px;
    border-radius:50%;
    border:2px solid var(--mode-color, var(--teal));
    opacity:0;
  }
  .listening-ring.on{ animation:pulse 1.4s ease-out infinite; }
  @keyframes pulse{
    0%{transform:scale(0.75); opacity:0.7;}
    100%{transform:scale(1.55); opacity:0;}
  }

  .bittu{
    position:relative;
    width:118px;height:118px;
    animation:bob 2.8s ease-in-out infinite;
  }
  .bittu.speaking{animation:bob 0.45s ease-in-out infinite;}
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-9px) rotate(2deg);}
  }
  .bittu svg{ width:100%; height:100%; overflow:visible; display:block; }
  .b-mouth{ transform-origin:100px 128px; transition:transform 0.1s ease; }
  .bittu.speaking .b-mouth{ animation:talk 0.28s ease-in-out infinite; }
  @keyframes talk{
    0%,100%{ transform:scaleY(1); }
    50%{ transform:scaleY(2.2) translateY(2px); }
  }
  .b-eye{ animation:blink 4.4s infinite; transform-origin:center; }
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1);}
    95%{transform:scaleY(0.12);}
  }
  .b-armL{ animation:waveL 2.8s ease-in-out infinite; transform-origin:70px 118px; }
  .b-armR{ animation:waveR 2.8s ease-in-out infinite 0.15s; transform-origin:130px 118px; }
  @keyframes waveL{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-10deg);} }
  @keyframes waveR{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(10deg);} }

  .name-row{
    position:absolute;
    bottom:12px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .name-tag{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--text-muted);
    letter-spacing:0.3px;
  }
  .name-tag span{color:var(--text-primary);}
  .name-edit-btn{
    background:none; border:none; cursor:pointer;
    color:var(--text-muted); font-size:12px;
    padding:2px 6px; border-radius:8px;
  }
  .name-edit-btn:active{ background:rgba(255,255,255,0.08); }
  .name-input{
    background:var(--bg-panel);
    border:1px solid var(--mode-color, var(--teal));
    border-radius:10px;
    color:var(--text-primary);
    font-family:'Baloo 2',sans-serif;
    font-size:13px;
    padding:4px 8px;
    width:110px;
    outline:none;
  }

  /* ---- Mode selector ---- */
  .modes{
    display:flex;
    gap:8px;
    padding:10px 16px;
    overflow-x:auto;
    flex-shrink:0;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .modes::-webkit-scrollbar{display:none;}
  .mode-chip{
    flex-shrink:0;
    padding:7px 14px;
    border-radius:20px;
    background:var(--bg-panel);
    color:var(--text-muted);
    font-size:13px;
    font-weight:600;
    border:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
    transition:all 0.2s ease;
    font-family:'Inter',sans-serif;
    white-space:nowrap;
  }
  .mode-chip.active{
    background:var(--mode-color, var(--teal));
    color:#0e0f16;
    border-color:transparent;
  }

  /* ---- Chat ---- */
  .chat{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bubble{
    max-width:78%;
    padding:10px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.45;
    overflow-wrap:break-word;
    word-break:break-word;
    white-space:pre-wrap;
  }
  .bubble.bittu{
    background:var(--bg-panel);
    align-self:flex-start;
    border-bottom-left-radius:4px;
  }
  .bubble.me{
    background:var(--bg-bubble-mine);
    align-self:flex-end;
    border-bottom-right-radius:4px;
  }
  .bubble.typing{ color:var(--text-muted); font-style:italic; }
  .system-note{
    align-self:center;
    font-size:11px;
    color:var(--text-muted);
    text-align:center;
    padding:4px 14px;
    max-width:90%;
  }

  /* ---- Input ---- */
  .input-row{
    display:flex;
    align-items:center;
    gap:7px;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(255,255,255,0.06);
    flex-shrink:0;
    background:var(--bg-deep);
  }
  .input-row input{
    flex:1;
    min-width:0;
    background:var(--bg-panel);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:22px;
    padding:11px 16px;
    color:var(--text-primary);
    font-size:14.5px;
    font-family:'Inter',sans-serif;
    outline:none;
  }
  .input-row input::placeholder{color:var(--text-muted);}
  .icon-btn{
    width:42px;height:42px;
    border-radius:50%;
    border:none;
    color:#0e0f16;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
    transition:background 0.3s ease, transform 0.15s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-btn:active{transform:scale(0.92);}
  .icon-btn:disabled{opacity:0.5;}
  .send-btn{background:var(--mode-color, var(--teal));}
  .mic-btn{background:var(--bg-panel); color:var(--text-primary); border:1px solid rgba(255,255,255,0.1);}
  .mic-btn.active{background:var(--danger-soft); color:#fff;}
  .call-btn{
    background:var(--bg-panel); color:var(--text-primary);
    border:1px solid rgba(255,255,255,0.1);
  }
  .call-btn.active{
    background:linear-gradient(135deg, var(--mode-color, var(--teal)), var(--marigold));
    color:#0e0f16;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="stage">
    <div class="energy-ring e1"></div>
    <div class="energy-ring e2"></div>
    <div class="energy-ring e3"></div>
    <div class="energy-spark" style="top:30%; left:20%; animation-delay:0s;"></div>
    <div class="energy-spark" style="top:60%; left:78%; animation-delay:1s;"></div>
    <div class="energy-spark" style="top:20%; left:70%; animation-delay:2s;"></div>
    <div class="energy-spark" style="top:75%; left:30%; animation-delay:0.5s;"></div>
    <div class="stage-glow"></div>
    <div class="listening-ring" id="listeningRing"></div>
    <div class="bittu" id="bittuChar">
      <svg viewBox="0 0 200 200">
        <ellipse cx="70" cy="150" rx="10" ry="4" fill="#000" opacity="0.25"/>
        <ellipse cx="130" cy="150" rx="10" ry="4" fill="#000" opacity="0.25"/>
        <path class="b-armL" d="M60 122 Q30 112 25 88" stroke="#2b2f45" stroke-width="11" stroke-linecap="round" fill="none"/>
        <path class="b-armR" d="M140 122 Q170 112 175 88" stroke="#2b2f45" stroke-width="11" stroke-linecap="round" fill="none"/>
        <!-- jacket collar -->
        <path d="M55 150 Q100 168 145 150 L138 125 Q100 140 62 125 Z" fill="#232544"/>
        <!-- face -->
        <ellipse cx="100" cy="102" rx="70" ry="66" fill="#f2c9a0"/>
        <!-- silver spiky hair -->
        <path d="M32 92 Q20 50 45 30 Q40 55 55 42 Q52 20 78 12 Q68 34 85 28 Q82 8 112 8 Q100 28 120 22 Q118 4 148 16 Q130 30 150 34 Q168 44 160 70 Q150 50 145 60 Q152 38 128 34 Q140 50 118 42 Q128 30 100 32 Q112 44 88 40 Q98 30 70 36 Q82 48 58 48 Q66 60 45 58 Q52 74 32 92 Z" fill="#dfe4ee"/>
        <path d="M32 92 Q20 50 45 30 Q40 55 55 42 Q52 20 78 12 Q68 34 85 28 Q82 8 112 8 Q100 28 120 22 Q118 4 148 16 Q130 30 150 34 Q168 44 160 70 Q150 50 145 60 Q152 38 128 34 Q140 50 118 42 Q128 30 100 32 Q112 44 88 40 Q98 30 70 36 Q82 48 58 48 Q66 60 45 58 Q52 74 32 92 Z" fill="none" stroke="#c3cbdc" stroke-width="1.5" opacity="0.6"/>
        <!-- visor -->
        <rect x="42" y="86" rx="10" ry="10" width="116" height="26" fill="#181a24"/>
        <rect x="42" y="86" rx="10" ry="10" width="116" height="26" fill="none" stroke="#3a3e55" stroke-width="1.5"/>
        <ellipse class="b-eye" cx="74" cy="99" rx="6" ry="7" fill="#4d8cff"/>
        <ellipse class="b-eye" cx="126" cy="99" rx="6" ry="7" fill="#4d8cff"/>
        <circle cx="74" cy="99" r="9" fill="none" stroke="#4d8cff" opacity="0.5"/>
        <circle cx="126" cy="99" r="9" fill="none" stroke="#4d8cff" opacity="0.5"/>
        <!-- blush -->
        <ellipse cx="58" cy="120" rx="9" ry="5" fill="#e8836b" opacity="0.4"/>
        <ellipse cx="142" cy="120" rx="9" ry="5" fill="#e8836b" opacity="0.4"/>
        <!-- mouth -->
        <path class="b-mouth" d="M90 128 Q100 138 110 128" stroke="#7a4a30" stroke-width="4" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="name-row">
      <div class="name-tag" id="nameTag"><span id="nameSpan">Bittu</span> · tera dost hai yaar</div>
      <button class="name-edit-btn" id="nameEditBtn" title="Naam badlo">✏️</button>
    </div>
  </div>

  <div class="modes" id="modes"></div>

  <div class="chat" id="chat">
    <div class="bubble bittu" id="welcomeBubble">Are bhai! Kya haal hai? Bata kya chal raha hai zindagi mein 👀</div>
    <div class="system-note">Ek dost jaisa AI hai — real emergency ya serious problem ho toh kisi trusted insaan ya helpline se zaroor baat karna. 📞 button se hands-free voice call jaisi baat kar sakte ho.</div>
  </div>

  <div class="input-row">
    <button class="icon-btn call-btn" id="callBtn" title="Voice call jaisa baat karo">📞</button>
    <button class="icon-btn mic-btn" id="micBtn" title="Bol ke bhejo">🎤</button>
    <input type="text" id="userInput" placeholder="Message likho..." />
    <button class="icon-btn send-btn" id="sendBtn">➤</button>
  </div>
</div>

<script>
function setAppHeight(){ document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px'); }
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', setAppHeight);

let assistantName = localStorage.getItem('bittu_name') || 'Bittu';
const nameSpan = document.getElementById('nameSpan');
const nameEditBtn = document.getElementById('nameEditBtn');
const nameRow = document.querySelector('.name-row');
function renderName(){
  nameSpan.textContent = assistantName;
  document.title = assistantName + ' — Tera AI Dost';
}
renderName();
nameEditBtn.onclick = () => {
  const input = document.createElement('input');
  input.className = 'name-input';
  input.value = assistantName;
  input.maxLength = 16;
  nameRow.innerHTML = '';
  nameRow.appendChild(input);
  input.focus();
  input.select();
  function save(){
    const val = input.value.trim();
    if(val){ assistantName = val; localStorage.setItem('bittu_name', val); }
    nameRow.innerHTML = '<div class="name-tag" id="nameTag"><span id="nameSpan">' + assistantName + '</span> · tera dost hai yaar</div><button class="name-edit-btn" id="nameEditBtn" title="Naam badlo">✏️</button>';
    document.getElementById('nameEditBtn').onclick = nameEditBtn.onclick;
    document.title = assistantName + ' — Tera AI Dost';
  }
  input.addEventListener('keydown', e => { if(e.key === 'Enter') save(); });
  input.addEventListener('blur', save);
};

const MODES = [
  { id:'chill', label:'Chill Dost', color:'#4fd1c5',
    prompt:`Tum casual "chill dost" mode mein ho. Halka-phulka, mazedaar, dosti wali baat karo — jaise koi dost canteen mein baithke gap maar raha ho.` },
  { id:'fighter', label:'Fighter', color:'#e8836b',
    prompt:`Tum "fighter mode" mein ho. Koi conflict, jhagda, ya tension wali situation hai. Pehle safety aur de-escalation ka advice do — kabhi bhi fight badhane wali baat mat karo. Practical, sahi, safe solution do, thoda protective bade bhai/behen jaisa tone.` },
  { id:'focus', label:'Padhaku', color:'#8fd694',
    prompt:`Tum "padhaku/focus mode" mein ho. Study, exam, ya deadline se related baat ho rahi hai. Practical study tips, motivation, realistic advice do — bina lecture diye, dost jaisa encourage karo.` },
  { id:'comedian', label:'Comedian', color:'#f4a53a',
    prompt:`Tum "comedian mode" mein ho. Halka mazaak, wit, aur mast tone use karo taaki mood light ho jaaye — lekin agar baat serious ho jaaye toh turant sahi tone mein aa jao.` },
  { id:'artist', label:'Artist', color:'#b98af4',
    prompt:`Tum "artist mode" mein ho. Thoda creative, thoda shayarana, sochne-samajhne wala tone rakho — jaise koi dost jo cheezon ko different angle se dekhta hai.` }
];

function baseSystem(){
  return `Tum "${assistantName}" ho — ek AI dost jo Indian college/school students ke liye bana hai. Hinglish mein, casual, dost jaisi language mein baat karo — chhoti, natural, real conversation jaisi (2-4 lines max, lecture mat do, kyunki yeh voice mein bhi bola jaata hai).

Kabhi bhi romantic ya emotional-dependency badhane wali baat mat karo. Agar koi "I love you" ya romantic tarike se baat kare, halke tarike se clarify karo ki tum AI ho, dost ki tarah support de sakte ho par romance nahi — bina awkward banaye, dost jaise tareeke se.

Agar koi genuinely distress mein lage (self-harm, severe depression, real danger ke signs), turant seriously respond karo aur unhe kisi trusted insaan, family, ya helpline se baat karne ke liye encourage karo — chill tone chhod ke.

Hamesha safe aur practical advice do — kabhi bhi kisi risky, harmful, ya dangerous cheez ko encourage mat karo. Sirf plain text mein bolo, koi markdown symbols (*, #, -) use mat karo kyunki yeh voice mein bola jaayega.`;
}

let currentMode = MODES[0];
let history = [];
let voiceModeOn = false;
let recognizing = false;
let isSending = false;
const MAX_HISTORY_TURNS = 16;

const modesEl = document.getElementById('modes');
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const callBtn = document.getElementById('callBtn');
const bittuChar = document.getElementById('bittuChar');
const listeningRing = document.getElementById('listeningRing');

function applyModeColor(color){ document.documentElement.style.setProperty('--mode-color', color); }

function renderModes(){
  modesEl.innerHTML = '';
  MODES.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'mode-chip' + (m.id === currentMode.id ? ' active' : '');
    chip.textContent = m.label;
    chip.style.setProperty('--mode-color', m.color);
    chip.onclick = () => {
      if(currentMode.id === m.id) return;
      currentMode = m;
      applyModeColor(m.color);
      renderModes();
      addBubble('— ' + assistantName + ' ab "' + m.label + '" mode mein hai —', 'system');
    };
    modesEl.appendChild(chip);
  });
}

function addBubble(text, who){
  const b = document.createElement('div');
  b.className = (who === 'system') ? 'system-note' : ('bubble ' + who);
  b.textContent = text;
  chatEl.appendChild(b);
  chatEl.scrollTop = chatEl.scrollHeight;
  return b;
}

let cachedVoices = [];
function loadVoices(){ cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text){
  return new Promise((resolve) => {
    if(!('speechSynthesis' in window) || cachedVoices.length === 0){
      resolve();
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const hiVoice = cachedVoices.find(v => v.lang && v.lang.toLowerCase().startsWith('hi'));
    const inVoice = cachedVoices.find(v => v.lang && v.lang.toLowerCase().includes('en-in'));
    utter.voice = hiVoice || inVoice || cachedVoices[0];
    utter.rate = 1.02;
    utter.onstart = () => bittuChar.classList.add('speaking');
    utter.onend = () => { bittuChar.classList.remove('speaking'); resolve(); };
    utter.onerror = () => { bittuChar.classList.remove('speaking'); resolve(); };
    window.speechSynthesis.speak(utter);
  });
}

let recognition = null;
let sttUnsupportedWarned = false;
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRec){
  recognition = new SpeechRec();
  recognition.lang = 'hi-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognizing = true;
    micBtn.classList.add('active');
    listeningRing.classList.add('on');
  };
  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove('active');
    listeningRing.classList.remove('on');
  };
  recognition.onresult = (event) => {
    const said = event.results[0][0].transcript;
    inputEl.value = said;
    sendMessage();
  };
  recognition.onerror = (event) => {
    recognizing = false;
    micBtn.classList.remove('active');
    listeningRing.classList.remove('on');
    if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
      addBubble('Mic ka permission block hai — browser settings mein is site ke liye mic allow karo, phir page reload karo.', 'system');
      voiceModeOn = false;
      callBtn.classList.remove('active');
    } else if(event.error === 'language-not-supported' && recognition.lang !== 'en-IN'){
      recognition.lang = 'en-IN';
      addBubble('Hindi voice recognition is device pe available nahi hai, English mode try kar raha hoon.', 'system');
    } else if(event.error === 'audio-capture'){
      addBubble('Mic nahi mil raha — check karo koi doosra app mic use toh nahi kar raha.', 'system');
      voiceModeOn = false;
      callBtn.classList.remove('active');
    } else if(event.error !== 'no-speech' && event.error !== 'aborted'){
      addBubble('Mic mein dikkat aayi (' + event.error + '), 🎤 button dobara dabao.', 'system');
      voiceModeOn = false;
      callBtn.classList.remove('active');
    }
  };
} else {
  micBtn.disabled = true;
  micBtn.title = 'Is browser mein voice input support nahi hai — Chrome try karo';
  callBtn.disabled = true;
}

function startListening(){
  if(!recognition){
    if(!sttUnsupportedWarned){
      addBubble('Is browser mein voice input support nahi hai. Android pe Chrome use karo, ya iPhone pe abhi ke liye sirf text chat use karo.', 'system');
      sttUnsupportedWarned = true;
    }
    return;
  }
  if(recognizing){ try{ recognition.stop(); } catch(e){} return; }
  try{ recognition.start(); }
  catch(e){
    try{ recognition.stop(); } catch(e2){}
    setTimeout(() => {
      try{ recognition.start(); }
      catch(e3){
        addBubble('Voice dobara start nahi ho paya — 🎤 button ek baar khud dabao.', 'system');
        voiceModeOn = false;
        callBtn.classList.remove('active');
      }
    }, 300);
  }
}

micBtn.onclick = () => { voiceModeOn = false; callBtn.classList.remove('active'); startListening(); };

callBtn.onclick = () => {
  voiceModeOn = !voiceModeOn;
  callBtn.classList.toggle('active', voiceModeOn);
  if(voiceModeOn){
    addBubble('📞 Voice call mode ON — ' + assistantName + ' se seedha bolke baat karo. Band karne ke liye phone icon dobara dabao.', 'system');
    startListening();
  } else {
    addBubble('📞 Voice call mode OFF', 'system');
    if(recognizing){ try{ recognition.stop(); } catch(e){} }
    window.speechSynthesis.cancel();
  }
};

async function callBackend(payload, attempt){
  const response = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await response.json();
  if(!response.ok){
    const msg = (data.error || '').toLowerCase();
    const isRateLimit = response.status === 429 || msg.includes('rate') || msg.includes('quota');
    if(isRateLimit && attempt < 2){
      await new Promise(r => setTimeout(r, 2500 * (attempt + 1)));
      return callBackend(payload, attempt + 1);
    }
    throw new Error(isRateLimit ? 'RATE_LIMIT' : (data.error || 'API error'));
  }
  return data;
}

async function sendMessage(){
  if(isSending) return;
  const text = inputEl.value.trim();
  if(!text) return;
  isSending = true;
  inputEl.value = '';
  sendBtn.disabled = true;
  inputEl.disabled = true;

  addBubble(text, 'me');
  history.push({role:'user', content:text});
  if(history.length > MAX_HISTORY_TURNS){
    history = history.slice(history.length - MAX_HISTORY_TURNS);
  }

  const typing = addBubble(assistantName + ' type kar raha hai...', 'bittu typing');

  try{
    const data = await callBackend({ system: baseSystem() + "\n\n" + currentMode.prompt, messages: history }, 0);
    const reply = data.reply || "Are yaar, kuch gadbad ho gayi, phir se try kar.";
    typing.remove();
    addBubble(reply, 'bittu');
    history.push({role:'assistant', content:reply});

    if(voiceModeOn){
      await speak(reply);
      if(voiceModeOn) startListening();
    }
  } catch(err){
    typing.remove();
    if(String(err.message) === 'RATE_LIMIT'){
      addBubble('Thoda busy hai abhi (bahut zyada messages ek saath aa gaye) — 10-15 second ruk ke phir try kar.', 'bittu');
    } else {
      addBubble("Network mein thodi gadbad hai yaar, ek baar phir try kar.", 'bittu');
    }
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    inputEl.disabled = false;
    isSending = false;
    inputEl.focus();
  }
}

sendBtn.onclick = sendMessage;
inputEl.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); sendMessage(); }
});

applyModeColor(currentMode.color);
renderModes();
</script>
</body>
